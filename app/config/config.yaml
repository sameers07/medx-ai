model:
  architecture: resnet50
  num_classes: 14
  input_size: 224
  pretrained: true
  class_names:
    - Atelectasis
    - Cardiomegaly
    - Effusion
    - Infiltration
    - Mass
    - Nodule
    - Pneumonia
    - Pneumothorax
    - Consolidation
    - Edema
    - Emphysema
    - Fibrosis
    - Pleural_Thickening
    - Hernia

training:
  batch_size: 32
  epochs: 20
  learning_rate: 0.0001
  optimizer: adam

explainability:
  method: gradcam
  target_layer: layer4

report_generation:
  provider: openai
  model: gpt-4o-mini
  max_tokens: 512
