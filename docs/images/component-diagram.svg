<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="820" height="380" fill="#ffffff"/>

  <!-- Frontend -->
  <rect x="30" y="140" width="160" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="110" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350f">Frontend</text>
  <text x="110" y="192" text-anchor="middle" font-size="11" fill="#78350f">Streamlit UI</text>
  <text x="110" y="208" text-anchor="middle" font-size="11" fill="#78350f">frontend/app.py</text>

  <line x1="190" y1="190" x2="240" y2="190" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Backend -->
  <rect x="240" y="140" width="160" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">Backend</text>
  <text x="320" y="192" text-anchor="middle" font-size="11" fill="#14532d">FastAPI routes</text>
  <text x="320" y="208" text-anchor="middle" font-size="11" fill="#14532d">app/api/, app/core/</text>
  <text x="320" y="224" text-anchor="middle" font-size="11" fill="#14532d">app/middleware/</text>

  <line x1="400" y1="190" x2="450" y2="190" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- AI Engine -->
  <rect x="450" y="140" width="160" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="530" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">AI Engine</text>
  <text x="530" y="192" text-anchor="middle" font-size="11" fill="#7f1d1d">app/services/*</text>
  <text x="530" y="208" text-anchor="middle" font-size="11" fill="#7f1d1d">ResNet-50, Grad-CAM,</text>
  <text x="530" y="224" text-anchor="middle" font-size="11" fill="#7f1d1d">LLM report</text>

  <line x1="610" y1="190" x2="660" y2="190" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- Database -->
  <rect x="660" y="140" width="130" height="100" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="725" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#312e81">Database</text>
  <text x="725" y="192" text-anchor="middle" font-size="11" fill="#312e81">Postgres/SQLite</text>
  <text x="725" y="208" text-anchor="middle" font-size="11" fill="#312e81">via SQLAlchemy</text>
  <text x="725" y="224" text-anchor="middle" font-size="11" fill="#312e81">+ Alembic</text>

  <!-- return arrows (dashed, response direction) -->
  <line x1="660" y1="260" x2="610" y2="260" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow3)"/>
  <line x1="450" y1="260" x2="400" y2="260" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow3)"/>
  <line x1="240" y1="260" x2="190" y2="260" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow3)"/>
  <text x="410" y="285" text-anchor="middle" font-size="11" fill="#64748b">responses flow back the same path (solid = request, dashed = response)</text>

  <text x="410" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Component View</text>
  <text x="410" y="60" text-anchor="middle" font-size="12" fill="#475569">Each layer only talks to its neighbor — Backend never touches torch/PIL directly, AI Engine never touches HTTP</text>
</svg>
