<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>

  <!-- lifelines -->
  <g font-size="13" fill="#0f172a">
    <text x="70" y="30" text-anchor="middle" font-weight="bold">User</text>
    <text x="220" y="30" text-anchor="middle" font-weight="bold">Streamlit</text>
    <text x="380" y="30" text-anchor="middle" font-weight="bold">FastAPI</text>
    <text x="540" y="30" text-anchor="middle" font-weight="bold">Prediction/</text>
    <text x="540" y="45" text-anchor="middle" font-weight="bold">GradCAM/Report</text>
    <text x="720" y="30" text-anchor="middle" font-weight="bold">Postgres</text>
    <text x="850" y="30" text-anchor="middle" font-weight="bold">Disk</text>
  </g>
  <line x1="70" y1="55" x2="70" y2="530" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="220" y1="55" x2="220" y2="530" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="380" y1="55" x2="380" y2="530" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="540" y1="55" x2="540" y2="530" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="720" y1="55" x2="720" y2="530" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="850" y1="55" x2="850" y2="530" stroke="#cbd5e1" stroke-width="1.5"/>

  <g font-size="12" fill="#1e293b">
    <line x1="70" y1="80" x2="220" y2="80" stroke="#334155" marker-end="url(#arrow2)"/>
    <text x="145" y="72" text-anchor="middle">1. selects file, clicks Analyze</text>

    <line x1="220" y1="115" x2="380" y2="115" stroke="#334155" marker-end="url(#arrow2)"/>
    <text x="300" y="107" text-anchor="middle">2. POST /upload (file, patient_external_id)</text>

    <line x1="380" y1="150" x2="850" y2="150" stroke="#334155" marker-end="url(#arrow2)"/>
    <text x="615" y="142" text-anchor="middle">3. ImageService.validate() + StorageService.save()</text>

    <line x1="380" y1="185" x2="720" y2="185" stroke="#334155" marker-end="url(#arrow2)"/>
    <text x="550" y="177" text-anchor="middle">4. INSERT Patient (if new), Study</text>

    <line x1="380" y1="220" x2="220" y2="220" stroke="#16a34a" marker-end="url(#arrow2)"/>
    <text x="300" y="212" text-anchor="middle" fill="#16a34a">5. 201 {study_id}</text>

    <line x1="220" y1="255" x2="380" y2="255" stroke="#334155" marker-end="url(#arrow2)"/>
    <text x="300" y="247" text-anchor="middle">6. POST /predict/{study_id}</text>

    <line x1="380" y1="290" x2="720" y2="290" stroke="#334155" marker-end="url(#arrow2)"/>
    <text x="550" y="282" text-anchor="middle">7. SELECT Study</text>

    <line x1="380" y1="325" x2="540" y2="325" stroke="#334155" marker-end="url(#arrow2)"/>
    <text x="460" y="317" text-anchor="middle">8. preprocess -&gt; ResNet-50 -&gt; sigmoid</text>

    <line x1="540" y1="355" x2="540" y2="355" stroke="#334155"/>
    <text x="540" y="350" text-anchor="middle">9. Grad-CAM on top class</text>
    <line x1="540" y1="360" x2="850" y2="360" stroke="#334155" marker-end="url(#arrow2)"/>
    <text x="695" y="352" text-anchor="middle">save heatmap PNG</text>

    <line x1="540" y1="395" x2="540" y2="395" stroke="#334155"/>
    <text x="540" y="390" text-anchor="middle">10. ReportService -&gt; LLM</text>
    <text x="540" y="405" text-anchor="middle" font-size="10" fill="#64748b">(failure caught -&gt; report_text=null, not a 500)</text>

    <line x1="380" y1="435" x2="720" y2="435" stroke="#334155" marker-end="url(#arrow2)"/>
    <text x="550" y="427" text-anchor="middle">11. INSERT Prediction</text>

    <line x1="380" y1="470" x2="220" y2="470" stroke="#16a34a" marker-end="url(#arrow2)"/>
    <text x="300" y="462" text-anchor="middle" fill="#16a34a">12. 201 {labels, gradcam_path, report_text}</text>

    <line x1="220" y1="505" x2="70" y2="505" stroke="#16a34a" marker-end="url(#arrow2)"/>
    <text x="145" y="497" text-anchor="middle" fill="#16a34a">13. render chart + heatmap + report</text>
  </g>
</svg>
