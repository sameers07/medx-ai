<svg viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="crow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#334155" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="820" height="480" fill="#ffffff"/>

  <!-- Patient -->
  <rect x="40" y="40" width="200" height="150" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="140" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">patients</text>
  <line x1="40" y1="72" x2="240" y2="72" stroke="#16a34a"/>
  <text x="55" y="90" font-size="11" fill="#14532d">id (PK)</text>
  <text x="55" y="107" font-size="11" fill="#14532d">external_id (unique)</text>
  <text x="55" y="124" font-size="11" fill="#14532d">name, age, sex</text>
  <text x="55" y="141" font-size="11" fill="#14532d">created_at</text>
  <text x="55" y="163" font-size="10" fill="#166534">used as /upload's</text>
  <text x="55" y="177" font-size="10" fill="#166534">patient_external_id</text>

  <!-- Study -->
  <rect x="320" y="40" width="200" height="150" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="420" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c1d95">studies</text>
  <line x1="320" y1="72" x2="520" y2="72" stroke="#7c3aed"/>
  <text x="335" y="90" font-size="11" fill="#4c1d95">id (PK)</text>
  <text x="335" y="107" font-size="11" fill="#4c1d95">patient_id (FK -&gt; patients)</text>
  <text x="335" y="124" font-size="11" fill="#4c1d95">image_path</text>
  <text x="335" y="141" font-size="11" fill="#4c1d95">modality (default chest_xray)</text>
  <text x="335" y="163" font-size="10" fill="#5b21b6">one row per POST /upload</text>

  <!-- Prediction -->
  <rect x="600" y="20" width="200" height="200" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="700" y="42" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">predictions</text>
  <line x1="600" y1="52" x2="800" y2="52" stroke="#dc2626"/>
  <text x="615" y="70" font-size="11" fill="#7f1d1d">id (PK)</text>
  <text x="615" y="87" font-size="11" fill="#7f1d1d">study_id (FK -&gt; studies)</text>
  <text x="615" y="104" font-size="11" fill="#7f1d1d">user_id (FK -&gt; users, nullable)</text>
  <text x="615" y="121" font-size="11" fill="#7f1d1d">disease_labels (JSON)</text>
  <text x="615" y="138" font-size="11" fill="#7f1d1d">gradcam_path</text>
  <text x="615" y="155" font-size="11" fill="#7f1d1d">report_text (nullable)</text>
  <text x="615" y="172" font-size="11" fill="#7f1d1d">created_at</text>
  <text x="615" y="195" font-size="10" fill="#991b1b">one row per POST /predict/{study_id}</text>
  <text x="615" y="209" font-size="10" fill="#991b1b">call (re-running creates another)</text>

  <!-- User -->
  <rect x="600" y="300" width="200" height="120" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="700" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#312e81">users</text>
  <line x1="600" y1="332" x2="800" y2="332" stroke="#4338ca"/>
  <text x="615" y="350" font-size="11" fill="#312e81">id (PK)</text>
  <text x="615" y="367" font-size="11" fill="#312e81">email (unique), hashed_password</text>
  <text x="615" y="384" font-size="11" fill="#312e81">full_name, role</text>
  <text x="615" y="401" font-size="10" fill="#3730a3">schema exists; no auth wired up yet</text>

  <!-- relationships -->
  <line x1="240" y1="115" x2="320" y2="115" stroke="#334155" stroke-width="1.5" marker-end="url(#crow)"/>
  <text x="280" y="105" text-anchor="middle" font-size="11" fill="#334155">1 : N</text>

  <line x1="520" y1="115" x2="600" y2="115" stroke="#334155" stroke-width="1.5" marker-end="url(#crow)"/>
  <text x="560" y="105" text-anchor="middle" font-size="11" fill="#334155">1 : N</text>

  <path d="M700,300 C700,260 700,240 700,220" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#crow)"/>
  <text x="740" y="260" text-anchor="middle" font-size="11" fill="#334155">1 : N</text>
  <text x="740" y="274" text-anchor="middle" font-size="10" fill="#64748b">(optional)</text>

  <!-- Note: no History / ModelVersion table -->
  <rect x="40" y="260" width="480" height="160" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="60" y="285" font-size="12" font-weight="bold" fill="#475569">Deliberately not modeled as tables:</text>
  <text x="60" y="308" font-size="11" fill="#475569">• "History" — GET /history/{patient_id} is a query</text>
  <text x="60" y="324" font-size="11" fill="#475569">   (predictions JOIN studies WHERE patient_id = ?),</text>
  <text x="60" y="340" font-size="11" fill="#475569">   ordered by id desc. Not its own schema — nothing to</text>
  <text x="60" y="356" font-size="11" fill="#475569">   keep in sync, no risk of it drifting from predictions.</text>
  <text x="60" y="380" font-size="11" fill="#475569">• "ModelVersion" — not yet implemented. Real gap if</text>
  <text x="60" y="396" font-size="11" fill="#475569">   multiple model versions need to run side by side —</text>
  <text x="60" y="412" font-size="11" fill="#475569">   see system-design.md "scaling to multiple models".</text>
</svg>
